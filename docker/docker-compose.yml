version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: supplytwin_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supplytwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supplytwin_pass}
      POSTGRES_DB: ${POSTGRES_DB:-supplytwin_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supplytwin} -d ${POSTGRES_DB:-supplytwin_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: supplytwin_neo4j
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/supplytwin_pass}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p supplytwin_pass 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  neo4j_data:
